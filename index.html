<style>
:root{--bg:#000;--bd:#2f3336;--tx:#e7e9ea;--mu:#71767b;--ac:#1d9bf0;--sf:#16181c;--hv:#080808;--ln:#333639}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/20px "TwitterChirp",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
/* unlock */
#lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
#lock .box{width:100%;max-width:364px}
#lock img{width:64px;height:64px;border-radius:50%;display:block;margin-bottom:28px}
#lock h1{font-size:31px;line-height:36px;font-weight:800;margin:0 0 8px;letter-spacing:-.4px}
#lock p.s{color:var(--mu);margin:0 0 28px}
.fld{position:relative;border:1px solid var(--bd);border-radius:4px;height:56px;transition:border-color .15s}
.fld:focus-within{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.fld label{position:absolute;left:8px;top:8px;font-size:13px;color:var(--mu)}.fld:focus-within label{color:var(--ac)}
.fld input{position:absolute;inset:0;padding:26px 8px 6px;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:17px;letter-spacing:2px}
.pill-btn{display:block;width:100%;height:52px;margin-top:20px;border-radius:9999px;background:var(--tx);color:#0f1419;font-weight:700;font-size:17px;transition:background .15s}
.pill-btn:hover{background:#d7dbdc}
#err{color:#f4212e;font-size:13px;min-height:16px;margin-top:10px}
/* shell */
#app{max-width:600px;margin:0 auto;min-height:100vh;border-left:1px solid var(--bd);border-right:1px solid var(--bd)}
@media(max-width:600px){#app{border:0}}
.top{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.hd{display:flex;align-items:center;gap:12px;height:53px;padding:0 16px}
.hd img{width:32px;height:32px;border-radius:50%}.hd b{font-size:20px;line-height:24px;font-weight:800}.hd .m{margin-left:auto}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:1 0 auto;padding:0 14px;height:53px;color:var(--mu);font-weight:500;position:relative}
.tabs button:hover{background:rgba(231,233,234,.1)}
.tabs button.on{color:var(--tx);font-weight:700}
.tabs button.on:after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:4px;border-radius:9999px;background:var(--ac);width:var(--w,56px)}
.chips{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;height:32px;padding:0 16px;border-radius:9999px;border:1px solid var(--bd);font-size:14px;font-weight:700}
.chips button.on{background:var(--tx);color:#0f1419;border-color:var(--tx)}
.m{color:var(--mu)}
/* tweets */
.grp{border-bottom:1px solid var(--bd)}
.tw{display:flex;gap:12px;padding:12px 16px 0;position:relative}
.tw:hover{background:var(--hv)}
.av{width:40px;flex:none;display:flex;flex-direction:column;align-items:center}
.av img,.av .ini{width:40px;height:40px;border-radius:9999px;object-fit:cover;flex:none}
.ini{background:#333639;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--tx);font-size:17px}
.av .th{width:2px;flex:1;background:var(--ln);margin-top:4px;min-height:12px}
.bd{flex:1;min-width:0;padding-bottom:12px}
.nm{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.nm b{font-weight:700;overflow:hidden;text-overflow:ellipsis}.nm .vf{width:18.75px;height:18.75px;flex:none}
.nm span{color:var(--mu);overflow:hidden;text-overflow:ellipsis}
.rt{color:var(--mu);font-size:13px;font-weight:700;display:flex;gap:12px;padding:12px 16px 0 16px;margin-bottom:-8px}.rt svg{width:16px;height:16px;fill:var(--mu);margin-left:24px}
.tx{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;margin-top:2px}
.rp{color:var(--mu);margin-top:2px}
.acts{display:flex;justify-content:space-between;margin-top:12px;max-width:425px;color:var(--mu);font-size:13px}
.acts div{display:flex;align-items:center;gap:4px;min-width:0}.acts svg{width:18.75px;height:18.75px;fill:currentColor}
.acts .r2{display:flex;gap:12px}
.draft .acts{opacity:.45}
.tool{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:8px}
.ring{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.cp{height:32px;padding:0 16px;border-radius:9999px;background:var(--ac);color:#fff;font-weight:700;font-size:14px}
.cp:hover{background:#1a8cd8}.cp.ok{background:#00ba7c}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 16px 12px 68px}
.st{height:24px;padding:0 10px;border-radius:9999px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;border:1px solid}
.st:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.draft{color:#ffd400;border-color:rgba(255,212,0,.35)}.st.approved{color:#00ba7c;border-color:rgba(0,186,124,.35)}
.st.rejected{color:#f4212e;border-color:rgba(244,33,46,.35)}.st.posted{color:var(--ac);border-color:rgba(29,155,240,.35)}
.kind{color:var(--mu);font-size:13px}
details{width:100%}summary{list-style:none;color:var(--ac);font-size:13px;cursor:pointer;display:inline-block}summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:6px}.why{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px;font-size:14px;line-height:19px;color:#c9cccf}
.why b{color:var(--tx)}
.ex{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--mu);border:1px solid var(--bd);border-radius:4px;padding:0 5px;margin-left:4px}
.qt{display:block;margin-top:12px;border:1px solid var(--bd);border-radius:16px;padding:12px;color:var(--tx);font-size:15px}.qt:hover{text-decoration:none;background:#080808}.qt .tx{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pri{height:20px;padding:0 8px;border-radius:9999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.pri.high{background:rgba(244,33,46,.15);color:#ff6b74}.pri.med{background:rgba(255,212,0,.12);color:#ffd400}.pri.low{background:#202327;color:var(--mu)}
.st.respond{color:#00ba7c;border-color:rgba(0,186,124,.35)}.st.caution{color:#ff7a00;border-color:rgba(255,122,0,.35)}.st.ignore{color:var(--mu);border-color:var(--bd)}
.ob{padding:12px 16px;border-bottom:1px solid var(--bd)}.ob .nm{gap:6px}.ob p{margin:6px 0;color:#c9cccf;font-size:14px;line-height:19px}
.dm{background:#1d9bf0;color:#fff;border-radius:22px 22px 4px 22px;padding:10px 14px;margin:8px 0 8px auto;max-width:85%;white-space:pre-wrap;width:fit-content}
.lbl{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-top:10px}
.sec{padding:16px 16px 8px;font-size:20px;font-weight:800;border-bottom:1px solid var(--bd)}
.ghost{height:32px;padding:0 14px;border-radius:9999px;border:1px solid #536471;font-weight:700;font-size:14px;display:inline-flex;align-items:center;color:var(--tx)}.ghost:hover{text-decoration:none;background:rgba(231,233,234,.1)}
.tier{min-width:30px;height:30px;border-radius:8px;background:#202327;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.tier.A{background:rgba(29,155,240,.2);color:var(--ac)}.tier.B{background:rgba(0,186,124,.15);color:#00ba7c}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13.5px;margin-top:8px}.kv b{color:var(--mu);font-weight:500}
.foot{padding:32px 16px 48px;text-align:center;color:var(--mu);font-size:13px}

function ring(len){const r=9,c=2*Math.PI*r,p=Math.min(len/280,1),left=280-len,col=left<0?'#f4212e':left<=20?'#ffd400':'#1d9bf0',big=left<=20;
 return `<div class="ring"><svg width="${big?30:22}" height="${big?30:22}" viewBox="0 0 24 24" style="transform:rotate(-90deg)"><circle cx="12" cy="12" r="${r}" fill="none" stroke="#2f3336" stroke-width="2"/><circle cx="12" cy="12" r="${r}" fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" stroke-linecap="round"/></svg><span style="color:${left<0?'#f4212e':left<=20?'#ffd400':'var(--mu)'}">${left<=20?left:len+' / 280'}</span></div>`}
function avatar(h){return h==ME?`<img src="${AV}" alt="">`:`<div class="ini">${esc((h||'?')[0].toUpperCase())}</div>`}
function tweet(o){ // o:{handle,name,text,time,timeTitle,url,line,metrics,draft,replyTo,tool}
 const me=o.handle==ME,m=o.metrics||{},nm=me?'<b>Darkpool</b>'+I.vf:`<b>${esc(o.name||o.handle||'Unknown')}</b>`;
 const t=o.url?`<a class="m" href="${o.url}" target="_blank" title="${esc(o.timeTitle||'')}">${o.time}</a>`:`<span>${o.time}</span>`;
 return `<article class="tw"><div class="av">${avatar(o.handle)}${o.line?'<div class="th"></div>':''}</div><div class="bd">
 <div class="nm">${nm}<span>@${esc(o.handle||'unknown')}</span><span>·</span>${t}</div>
 ${o.replyTo?`<div class="rp">Replying to <a href="https://x.com/${o.replyTo}" target="_blank">@${esc(o.replyTo)}</a></div>`:''}
 <div class="tx">${o.text==null?'<span class="m">Original post not in archive. Open link to view.</span>':rich(o.text)}</div>
 ${o.quote&&o.quote.text?`<a class="qt" href="https://x.com/${o.quote.handle}/status/${o.quote.id}" target="_blank"><div class="nm">${o.quote.handle==ME?'<b>Darkpool</b>'+I.vf:''}<span>@${esc(o.quote.handle)}</span></div><div class="tx">${esc(clean(o.quote.text))}</div></a>`:''}
 ${o.noacts?'':`<div class="acts"><div>${I.rep}${n(m.reply_count)}</div><div>${I.rt}${n(m.retweet_count+(m.quote_count||0))}</div><div>${I.lk}${n(m.like_count)}</div><div>${I.vw}${n(m.impression_count)}</div><div class="r2">${I.bm}${I.sh}</div></div>`}
 ${o.tool||''}</div></article>`}
const byId=id=>D.archive.find(r=>r.id==id);
function parentFromUrl(url){const mm=(url||'').match(/x\.com\/([^/]+)\/status\/(\d+)/);if(!mm)return null;const a=byId(mm[2]);
 return a?{handle:ME,text:a.text,time:when(a.date),timeTitle:full(a.date),url:a.url,metrics:a.metrics}:{handle:mm[1],text:null,time:'',url}}
let CPY={};function cp(k,b){navigator.clipboard.writeText(CPY[k]).then(()=>{b.textContent='Copied';b.classList.add('ok');setTimeout(()=>{b.textContent='Copy';b.classList.remove('ok')},1400)})}
function drafts(){let h='';const L=D.drafts.filter(d=>!F||d.status==F);
 L.forEach((d,i)=>{const parts=d.type=='thread'?d.text.split(/\n---\n/):[d.text],ex=/^\[EXAMPLE\]/.test(d.text),par=d.type=='reply'?parentFromUrl(d.target):null;
  h+=`<section class="grp draft">`;
  if(par)h+=tweet({...par,line:true});
  parts.forEach((t,j)=>{const k=i+'_'+j;CPY[k]=clean(t);
   h+=tweet({handle:ME,text:t,time:'Draft'+(parts.length>1?` · ${j+1}/${parts.length}`:''),line:j<parts.length-1,replyTo:par?par.handle:null,
    tool:`<div class="tool">${ring(xlen(t))}<button class="cp" onclick="cp('${k}',this)">Copy</button></div>`})});
  h+=`<div class="meta"><span class="st ${esc(d.status)}">${esc(d.status[0].toUpperCase()+d.status.slice(1))}</span><span class="kind">${esc(d.type)}${ex?'<span class="ex">EXAMPLE</span>':''}</span>
  <details><summary>Why this draft</summary><div class="why"><b>Why:</b> ${esc(d.rationale)}${d.notes?`<br><br><b>Notes:</b> ${esc(d.notes)}`:''}${d.target?`<br><br><b>Target:</b> <a href="${esc(d.target)}" target="_blank">${esc(d.target)}</a>`:''}<br><br><span class="m">${esc(d.id)} · created ${esc(d.created)}</span></div></details></div></section>`});
 return h||`<div class="empty"><b>No drafts here</b><span class="m">Nothing with status “${esc(F)}” yet.</span></div>`}
function activity(){let h='';D.archive.forEach(r=>{const base={handle:ME,text:r.text,time:when(r.date),timeTitle:full(r.date),url:r.url,metrics:r.metrics};h+='<section class="grp">';
 if(r.type=='repost'){const mm=r.text.match(/^RT @(\w+): ([\s\S]*)$/);const rp=r.reposted||{};
  h+=`<div class="rt">${I.rt.replace('<svg','<svg')}<span>Darkpool reposted</span></div>`+tweet({handle:rp.handle||(mm&&mm[1]),text:rp.text||(mm?mm[2]:r.text),time:when(r.date),timeTitle:full(r.date),url:r.url,metrics:{}})}
 else if(r.type=='reply'&&r.in_reply_to){const p=r.in_reply_to,a=p.handle==ME?byId(p.id):null;
  h+=tweet({handle:p.handle,text:p.text,time:a?when(a.date):'',timeTitle:a?full(a.date):'',url:`https://x.com/${p.handle||'i'}/status/${p.id}`,metrics:a?a.metrics:{},noacts:!a,line:true})+tweet({...base,replyTo:p.handle})}
 else h+=tweet({...base,quote:r.quoted});
 h+='</section>'});return h}
const TABS=[[1,'Drafts'],[3,'Comments'],[4,'Outreach'],[5,'Targets'],[2,'Activity']];
function tabs(){$('tabs').innerHTML=TABS.map(([k,l])=>`<button class="${T==k?'on':''}" style="--w:${l.length*8+8}px" onclick="tab(${k})">${l}</button>`).join('')}
function tab(t){T=t;window.scrollTo(0,0);render()}
const prof=(h,sz)=>h==ME?`<img src="${AV}" style="width:${sz}px;height:${sz}px;border-radius:50%" alt="">`:`<div class="ini" style="width:${sz}px;height:${sz}px;border-radius:50%;flex:none">${esc((h||'?')[0].toUpperCase())}</div>`;
function comments(){const O={high:0,med:1,low:2};let L=(D.comments||[]).filter(c=>!F||c.priority==F).sort((a,b)=>O[a.priority]-O[b.priority]);
 return L.map((c,i)=>{const k='c'+i;CPY[k]=c.reply;return `<section class="grp">`+tweet({handle:c.author,name:c.author_name||c.author,text:c.target_text,time:when(c.target_time),timeTitle:full(c.target_time),url:c.url,metrics:c.target_metrics,line:true})+
 tweet({handle:ME,text:c.reply,time:'Draft',replyTo:c.author,tool:`<div class="tool"><a class="ghost" href="${c.url}" target="_blank" rel="noopener">Open on X</a>${ring(xlen(c.reply))}<button class="cp" onclick="cp('${k}',this)">Copy</button></div>`})+
 `<div class="meta"><span class="pri ${c.priority}">${c.priority.toUpperCase()}</span><span class="st ${esc(c.status)}">${esc(c.status)}</span><span class="kind">${c.author_followers?n(c.author_followers)+' followers':''}</span><details><summary>Angle</summary><div class="why">${esc(c.angle)}<br><br><span class="m">${esc(c.id)} · fetched ${esc(c.fetched||'')}</span></div></details></div></section>`}).join('')||'<div class="empty"><b>No comment drafts</b></div>'}
function outreach(){const O={respond:0,caution:1,ignore:2};const L=(D.outreach||[]).filter(o=>!F||o.triage==F).sort((a,b)=>O[a.triage]-O[b.triage]||({high:0,med:1,low:2}[a.priority]-{high:0,med:1,low:2}[b.priority]));
 const card=(o,i)=>{const k='o'+i;CPY[k]=o.draft;const h=(o.handle||'').split(',')[0].trim();
 return `<div class="ob"><div class="nm">${o.group?'<div class="ini" style="width:40px;height:40px;border-radius:50%">∗</div>':prof(h,40)}<div style="min-width:0"><div class="nm"><b>${esc(o.name)}</b>${!o.group&&h?`<span><a href="https://x.com/${esc(h)}" target="_blank">@${esc(h)}</a></span>`:''}</div><div class="m" style="font-size:13px">${esc(o.followers||'')} · ${esc(o.source)}</div></div></div>
 <div style="display:flex;gap:6px;margin-top:8px"><span class="st ${o.triage}">${o.triage}</span><span class="pri ${o.priority}">${o.priority.toUpperCase()}</span></div>
 ${o.group?`<p>${esc(o.handle)}</p>`:''}<p><span class="m">Context:</span> ${esc(o.context)}</p><p><span class="m">Why:</span> ${esc(o.reasoning)}</p>
 ${o.draft?`<div class="lbl">Suggested DM reply (not sent)</div><div class="dm">${esc(o.draft)}</div><div style="text-align:right"><button class="cp" onclick="cp('${k}',this)">Copy</button></div>`:''}
 ${o.public_angle?`<div class="lbl">Public reply angle</div><p>${esc(o.public_angle)}</p>`:''}</div>`};
 const main=L.filter(o=>!o.group),grp=L.filter(o=>o.group);
 return `<div class="ob m" style="font-size:13px">Default: reply in public, not in DMs. Only respond-tagged DMs are worth a message. Nothing here is ever sent automatically.</div>`+main.map(card).join('')+(grp.length?`<details class="ob"><summary>Spam &amp; promo groups (${grp.length}) · collapsed</summary>${grp.map((o,i)=>card(o,'g'+i)).join('')}</details>`:'')}
function targets(){const L=(D.targets||[]).filter(x=>!F||x.tier.startsWith(F));return L.map(x=>`<div class="ob"><div class="nm" style="gap:12px;align-items:flex-start;white-space:normal">
 <div class="tier ${x.tier[0]}">${esc(x.tier.split(' ')[0].slice(0,3))}</div><div style="min-width:0;flex:1"><div class="nm"><b><a style="color:var(--tx)" href="https://x.com/${esc(x.handle)}" target="_blank">@${esc(x.handle)}</a></b><span>${x.followers!=null?n(x.followers)+' followers':'followers unknown'}</span></div>
 <p style="margin:4px 0">${esc(x.why)}</p><div class="kv"><b>Angle</b><span>${esc(x.angle)}</span><b>Cadence</b><span>${esc(x.cadence)}</span><b>fomo</b><span>${esc(x.fomo_alert_relevance)}</span><b>Evidence</b><span class="m">${esc(x.evidence)}</span></div></div></div></div>`).join('')}
function setF(f){F=f;render()}
const CH={1:[['','All'],['draft','Draft'],['approved','Approved'],['rejected','Rejected'],['posted','Posted']],3:[['','All'],['high','High'],['med','Med'],['low','Low']],4:[['','All'],['respond','Respond'],['caution','Caution'],['ignore','Ignore']],5:[['','All'],['A','Tier A'],['B','Tier B'],['C','Tier C'],['Supporter','Supporters'],['Watch','Watch']]};
const FK={1:d=>d.status,3:c=>c.priority,4:o=>o.triage,5:x=>x.tier},SRC={1:'drafts',3:'comments',4:'outreach',5:'targets'};
function render(){tabs();const c=$('chips');if(CH[T]){const arr=D[SRC[T]]||[],cnt=v=>arr.filter(x=>!v||FK[T](x).startsWith(v)).length;if(!CH[T].some(x=>x[0]==F))F='';
 c.hidden=false;c.innerHTML=CH[T].map(([v,l])=>`<button class="${F==v?'on':''}" onclick="setF('${v}')">${l} <span style="opacity:.6;font-weight:400">${cnt(v)}</span></button>`).join('')}else c.hidden=true;
 $('main').innerHTML=T==1?drafts():T==3?comments():T==4?outreach():T==5?targets():activity();
 $('main').innerHTML+=`<div class="foot">${({1:D.drafts.length+' drafts',2:D.archive.length+' posts in archive',3:(D.comments||[]).length+' comment drafts',4:(D.outreach||[]).length+' outreach items',5:(D.targets||[]).length+' targets'})[T]} · nothing here is posted automatically</div>`}
</script></body></html>
