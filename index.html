<style>
:root{--bg:#000;--bd:#2f3336;--tx:#e7e9ea;--mu:#71767b;--ac:#1d9bf0;--sf:#16181c;--hv:#080808;--ln:#333639}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/20px "TwitterChirp",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
/* unlock */
#lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
#lock .box{width:100%;max-width:364px}
#lock img{width:64px;height:64px;border-radius:50%;display:block;margin-bottom:28px}
#lock h1{font-size:31px;line-height:36px;font-weight:800;margin:0 0 8px;letter-spacing:-.4px}
#lock p.s{color:var(--mu);margin:0 0 28px}
.fld{position:relative;border:1px solid var(--bd);border-radius:4px;height:56px;transition:border-color .15s}
.fld:focus-within{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.fld label{position:absolute;left:8px;top:8px;font-size:13px;color:var(--mu)}.fld:focus-within label{color:var(--ac)}
.fld input{position:absolute;inset:0;padding:26px 8px 6px;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:17px;letter-spacing:2px}
.pill-btn{display:block;width:100%;height:52px;margin-top:20px;border-radius:9999px;background:var(--tx);color:#0f1419;font-weight:700;font-size:17px;transition:background .15s}
.pill-btn:hover{background:#d7dbdc}
#err{color:#f4212e;font-size:13px;min-height:16px;margin-top:10px}
/* shell */
#app{max-width:600px;margin:0 auto;min-height:100vh;border-left:1px solid var(--bd);border-right:1px solid var(--bd)}
@media(max-width:600px){#app{border:0}}
.top{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.hd{display:flex;align-items:center;gap:12px;height:53px;padding:0 16px}
.hd img{width:32px;height:32px;border-radius:50%}.hd b{font-size:20px;line-height:24px;font-weight:800}.hd .m{margin-left:auto}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:1 0 auto;padding:0 14px;height:53px;color:var(--mu);font-weight:500;position:relative}
.tabs button:hover{background:rgba(231,233,234,.1)}
.tabs button.on{color:var(--tx);font-weight:700}
.tabs button.on:after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:4px;border-radius:9999px;background:var(--ac);width:var(--w,56px)}
.chips{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;height:32px;padding:0 16px;border-radius:9999px;border:1px solid var(--bd);font-size:14px;font-weight:700}
.chips button.on{background:var(--tx);color:#0f1419;border-color:var(--tx)}
.m{color:var(--mu)}
/* tweets */
.grp{border-bottom:1px solid var(--bd)}
.tw{display:flex;gap:12px;padding:12px 16px 0;position:relative}
.tw:hover{background:var(--hv)}
.av{width:40px;flex:none;display:flex;flex-direction:column;align-items:center}
.av img,.av .ini{width:40px;height:40px;border-radius:9999px;object-fit:cover;flex:none}
.ini{background:#333639;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--tx);font-size:17px}
.av .th{width:2px;flex:1;background:var(--ln);margin-top:4px;min-height:12px}
.bd{flex:1;min-width:0;padding-bottom:12px}
.nm{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.nm b{font-weight:700;overflow:hidden;text-overflow:ellipsis}.nm .vf{width:18.75px;height:18.75px;flex:none}
.nm span{color:var(--mu);overflow:hidden;text-overflow:ellipsis}
.rt{color:var(--mu);font-size:13px;font-weight:700;display:flex;gap:12px;padding:12px 16px 0 16px;margin-bottom:-8px}.rt svg{width:16px;height:16px;fill:var(--mu);margin-left:24px}
.tx{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;margin-top:2px}
.rp{color:var(--mu);margin-top:2px}
.acts{display:flex;justify-content:space-between;margin-top:12px;max-width:425px;color:var(--mu);font-size:13px}
.acts div{display:flex;align-items:center;gap:4px;min-width:0}.acts svg{width:18.75px;height:18.75px;fill:currentColor}
.acts .r2{display:flex;gap:12px}
.draft .acts{opacity:.45}
.tool{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px 12px;margin-top:8px}
.ring{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.cp{height:32px;padding:0 16px;border-radius:9999px;background:var(--ac);color:#fff;font-weight:700;font-size:14px}
.cp:hover{background:#1a8cd8}.cp.ok{background:#00ba7c}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 16px 12px 68px}
.st{height:24px;padding:0 10px;border-radius:9999px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;border:1px solid}
.st:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.draft{color:#ffd400;border-color:rgba(255,212,0,.35)}.st.approved{color:#00ba7c;border-color:rgba(0,186,124,.35)}
.st.rejected{color:#f4212e;border-color:rgba(244,33,46,.35)}.st.posted{color:var(--ac);border-color:rgba(29,155,240,.35)}
.kind{color:var(--mu);font-size:13px}
details{width:100%}summary{list-style:none;color:var(--ac);font-size:13px;cursor:pointer;display:inline-block}summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:6px}.why{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px;font-size:14px;line-height:19px;color:#c9cccf}
.why b{color:var(--tx)}
.ex{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--mu);border:1px solid var(--bd);border-radius:4px;padding:0 5px;margin-left:4px}
.qt{display:block;margin-top:12px;border:1px solid var(--bd);border-radius:16px;padding:12px;color:var(--tx);font-size:15px}.qt:hover{text-decoration:none;background:#080808}.qt .tx{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pri{height:20px;padding:0 8px;border-radius:9999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.pri.high{background:rgba(244,33,46,.15);color:#ff6b74}.pri.med{background:rgba(255,212,0,.12);color:#ffd400}.pri.low{background:#202327;color:var(--mu)}
.st.respond{color:#00ba7c;border-color:rgba(0,186,124,.35)}.st.caution{color:#ff7a00;border-color:rgba(255,122,0,.35)}.st.ignore{color:var(--mu);border-color:var(--bd)}
.ob{padding:12px 16px;border-bottom:1px solid var(--bd)}.ob .nm{gap:6px}.ob p{margin:6px 0;color:#c9cccf;font-size:14px;line-height:19px}
.dm{background:#1d9bf0;color:#fff;border-radius:22px 22px 4px 22px;padding:10px 14px;margin:8px 0 8px auto;max-width:85%;white-space:pre-wrap;width:fit-content}
.lbl{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-top:10px}
.sec{padding:16px 16px 8px;font-size:20px;font-weight:800;border-bottom:1px solid var(--bd)}
.ghost{height:32px;padding:0 14px;border-radius:9999px;border:1px solid #536471;font-weight:700;font-size:14px;display:inline-flex;align-items:center;color:var(--tx)}.ghost:hover{text-decoration:none;background:rgba(231,233,234,.1)}
.tier{min-width:30px;height:30px;border-radius:8px;background:#202327;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.tier.A{background:rgba(29,155,240,.2);color:var(--ac)}.tier.B{background:rgba(0,186,124,.15);color:#00ba7c}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13.5px;margin-top:8px}.kv b{color:var(--mu);font-weight:500}
.ty{height:20px;padding:0 8px;border-radius:9999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;background:rgba(29,155,240,.12);color:#8ecdf8}
.age{font-size:12px;color:var(--mu)}.stale{background:rgba(255,122,0,.15);color:#ff9a40;height:20px;padding:0 8px;border-radius:9999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.mix{display:flex;height:6px;border-radius:9999px;overflow:hidden;margin:8px 0 4px;background:#202327}.mix i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--mu)}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:4px}
.prog{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd)}.prog div{flex:1;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:8px 10px}
.prog b{display:block;font-size:20px;line-height:24px}.prog small{color:var(--mu);font-size:12px}.bar{height:4px;border-radius:9999px;background:#2f3336;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--tx);cursor:pointer;user-select:none}.chk input{width:20px;height:20px;accent-color:#00ba7c;margin:0}
.done{opacity:.4}.pb{width:auto!important;margin:12px 16px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px 14px}.pb summary{color:var(--tx);font-weight:800;font-size:15px}
.pb h4{margin:12px 0 4px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}.pb ul{margin:0;padding-left:18px;font-size:14px;line-height:20px;color:#c9cccf}
.slot{font-size:13px;font-weight:700;color:#ffd400;padding:12px 16px 0 68px}
.md{margin-top:12px;border:1px solid var(--bd);border-radius:16px;overflow:hidden;position:relative;background:#16181c}
.md img,.md video{display:block;width:100%;height:100%;object-fit:cover}
.md .play{position:absolute;inset:0;margin:auto;width:60px;height:60px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;border:4px solid #fff;pointer-events:none}
.md .dur{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.77);color:#fff;font-size:13px;padding:0 6px;border-radius:4px;line-height:20px}
.dl{white-space:nowrap;height:32px;padding:0 12px;border-radius:9999px;border:1px solid #536471;font-weight:700;font-size:14px;display:inline-flex;align-items:center;color:var(--tx)}.dl:hover{text-decoration:none;background:rgba(231,233,234,.1)}
.calday{padding:14px 16px 6px;font-size:17px;font-weight:800;border-bottom:1px solid var(--bd);position:sticky;top:106px;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:2}
.crow{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd);cursor:pointer}.crow:hover{background:var(--hv)}
.crow .th2{width:72px;height:72px;border-radius:12px;flex:none;object-fit:cover;border:1px solid var(--bd);background:#16181c;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:11px;text-align:center}
.crow .tx2{font-size:14px;line-height:19px;color:#c9cccf;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.st.needs{color:#ff7a00;border-color:rgba(255,122,0,.35)}
.foot{padding:32px 16px 48px;text-align:center;color:var(--mu);font-size:13px}
.empty{padding:48px 32px;text-align:center}.empty b{display:block;font-size:31px;line-height:36px;font-weight:800;margin-bottom:8px}
.fm{background:rgba(249,24,128,.15);color:#f91880;height:20px;padding:0 8px;border-radius:9999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center}.cf{height:20px;padding:0 8px;border-radius:9999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;background:#202327;color:#71767b}.cf.confirmed{background:rgba(0,186,124,.15);color:#00ba7c}.cf.likely{background:rgba(255,212,0,.13);color:#ffd400}main a{overflow-wrap:anywhere;word-break:break-word}
.tgb{background:#182533;color:#e7e9ea;border-radius:14px 14px 14px 4px;padding:10px 14px;margin:8px 16px;white-space:pre-wrap;max-width:520px;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.cbox{margin:8px 16px 12px;padding:4px 14px;border:1px solid var(--bd);border-radius:14px}.cbox.ok{border-color:#00ba7c55;background:#00ba7c11}.cbox.warn{border-color:#ffd40055;background:#ffd40011}.cl{margin:8px 0;padding-left:18px;line-height:1.45}.cl li{margin:6px 0}.ccard{margin:10px 16px;padding:12px 14px;border:1px solid var(--bd);border-radius:14px}.ccard.me{border-color:#14f19588}.ccard dl{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:8px 0;font-size:14px}.ccard dt{color:var(--m,#71767b)}.ccard dd{margin:0;overflow-wrap:anywhere}
</style></head><body>
