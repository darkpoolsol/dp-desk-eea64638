<style>
:root{--bg:#000;--card:#000;--tx:#e7e9ea;--mu:#71767b;--bd:#2f3336;--bd2:#202327;--ac:#1d9bf0;--ok:#00ba7c;--warn:#ffd400;--red:#f4212e;--soft:#16181c;--tg:#2aabee;
 --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 var(--f);-webkit-font-smoothing:antialiased}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}button{font:inherit;color:inherit}
[hidden]{display:none!important}
/* lock */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#lock .box{width:100%;max-width:340px;text-align:center}#lock h1{font-size:22px;margin:16px 0 20px}
#lock input{width:100%;height:48px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:0 14px;font-size:16px;outline:none}
#lock input:focus{border-color:var(--ac)}#err{color:var(--red);min-height:20px;margin-top:10px;font-size:14px}
/* shell */
#app{max-width:640px;margin:0 auto;min-height:100vh;border-left:1px solid var(--bd2);border-right:1px solid var(--bd2)}
@media(max-width:640px){#app{border:0}}
header{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd2)}
.hd{display:flex;align-items:center;gap:12px;padding:12px 20px 4px}.hd img{width:32px;height:32px;border-radius:50%}
.hd b{font-size:19px;font-weight:800;letter-spacing:-.01em}.hd .sync{margin-left:auto;color:var(--mu);font-size:13px}
nav{display:flex;padding:0 8px;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;background:none;border:0;padding:14px 14px 0;cursor:pointer;color:var(--mu);font-weight:600;font-size:15px}
nav button span{display:inline-block;padding-bottom:12px;border-bottom:4px solid transparent}
nav button.on{color:var(--tx)}nav button.on span{border-color:var(--ac)}nav button:hover{background:rgba(231,233,234,.06)}
nav i{font-style:normal;color:var(--mu);font-weight:500;margin-left:6px;font-size:13px}
main{padding-bottom:120px}
/* sections */
.day{padding:22px 20px 8px;font-size:20px;font-weight:800;letter-spacing:-.01em;border-bottom:1px solid var(--bd2)}
.day small{display:block;color:var(--mu);font-size:13px;font-weight:500;margin-top:2px;letter-spacing:0}
.empty{padding:48px 24px;text-align:center;color:var(--mu)}
.note{margin:14px 20px;padding:14px 16px;border:1px solid var(--bd);border-radius:16px;color:var(--mu);font-size:14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.note b{color:var(--tx)}.note:hover{background:rgba(231,233,234,.03)}
/* card */
.card{border-bottom:1px solid var(--bd2);padding:16px 20px 18px;transition:opacity .2s}
.card.done{opacity:.42}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;font-size:13px;color:var(--mu)}
.meta .time{color:var(--tx);font-weight:700;font-size:14px}
.chip{border:1px solid var(--bd);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mu)}
.chip.warn{border-color:#5c4b00;color:var(--warn)}.chip.hi{border-color:#4a1d22;color:#ff6b7a}.chip.ok{border-color:#0b4d38;color:var(--ok)}
.meta a{margin-left:auto;color:var(--mu)}
/* tweet */
.tw{display:flex;gap:12px;position:relative}
.tw .av{flex:none;width:40px;display:flex;flex-direction:column;align-items:center}
.tw .av img,.tw .av .ini{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--soft)}
.ini{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mu)}
.tw .av .ln{flex:1;width:2px;background:var(--bd);margin-top:4px;min-height:12px}
.tw .bd{flex:1;min-width:0;padding-bottom:4px}
.tw.cont .bd{padding-bottom:14px}
.who{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;font-size:15px}
.who b{font-weight:700;overflow:hidden;text-overflow:ellipsis}.who span{color:var(--mu);overflow:hidden;text-overflow:ellipsis}
.vf{width:18px;height:18px;flex:none}
.rt{color:var(--mu);font-size:14px;margin-top:2px}
.tx{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;margin-top:2px;font-size:15px;line-height:1.42}
.tx .lk{color:var(--ac)}
.mx{display:flex;gap:28px;color:var(--mu);font-size:13px;margin-top:10px}
.md{margin-top:12px;border:1px solid var(--bd);border-radius:16px;overflow:hidden;background:#0a0a0a}
.md img,.md video{display:block;width:100%;height:auto;max-height:620px;object-fit:contain;background:#000}
.md img{cursor:zoom-in}
.cnt{font-size:12px;color:var(--mu);text-align:right;margin-top:4px}.cnt.over{color:var(--red);font-weight:700}
/* actions */
.acts{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 0 0 52px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none!important}
.btn:hover{background:rgba(231,233,234,.08)}
.btn.pri{background:var(--tx);color:#0f1419;border-color:var(--tx)}.btn.pri:hover{background:#d7dbdc}
.btn.tg{background:var(--tg);border-color:var(--tg);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:13px;font-weight:600;color:var(--mu)}
.btn[aria-disabled=true]{opacity:.35;pointer-events:none}
.btn.on{color:var(--ok);border-color:#0b4d38}
.btn svg{width:16px;height:16px}
.steps{margin:14px 0 0 52px;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:24px 1fr;gap:8px 10px;align-items:center}.step .bt{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}.step input{grid-column:2}
.step .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mu);flex:none}
.step input{width:100%;height:34px;border-radius:8px;border:1px solid var(--bd);background:#000;color:var(--tx);padding:0 10px;font-size:13px;outline:none}
.step input:focus{border-color:var(--ac)}
.step input.good{border-color:#0b4d38}
/* details */
details.more{margin:12px 0 0 52px;color:var(--mu);font-size:13px}
details.more summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;user-select:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--mu);border-bottom:1.5px solid var(--mu);transform:rotate(-45deg);transition:transform .15s}
details.more[open] summary::before{transform:rotate(45deg)}
details.more .in{margin-top:10px;padding:12px 14px;border:1px solid var(--bd2);border-radius:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
details.more .in b{color:var(--tx);font-weight:600}
.alt{margin-top:14px;padding-top:14px;border-top:1px dashed var(--bd)}
.alt .acts{margin-left:52px}
details.done-grp{border-bottom:1px solid var(--bd2)}details.done-grp>summary{padding:16px 20px;color:var(--mu);cursor:pointer;list-style:none;font-size:14px}
details.done-grp>summary::-webkit-details-marker{display:none}
/* telegram */
.tgw{display:flex;gap:10px}.tgw .tav{width:40px;height:40px;border-radius:50%;flex:none}
.bub{flex:1;min-width:0;background:#182533;border-radius:4px 16px 16px 16px;padding:10px 14px 8px}
.bub .ch{color:#64b5ef;font-weight:600;font-size:14px;margin-bottom:4px}
.bub .tx{font-size:15px}.bub .tm{text-align:right;color:#6d7f8f;font-size:12px;margin-top:4px}
/* balances */
.bsum{margin:14px 20px 6px;padding:16px 18px;border:1px solid var(--bd);border-radius:16px}
.bsum .lbl{color:var(--mu);font-size:13px}.bsum .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.bsum .sub{color:var(--mu);font-size:14px;font-variant-numeric:tabular-nums}.bsum .sub b{color:var(--tx);font-weight:600}
.bstat{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:13px;color:var(--mu)}.bstat .btn{margin-left:auto}
.bstat .chip.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.berr{margin-top:8px;font-size:12px;color:var(--warn)}
.bsec{padding:18px 20px 6px;color:var(--mu);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:12px}
.bsec span{font-weight:500;text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:baseline}
.brow .nm{font-weight:700;font-size:15px;overflow-wrap:anywhere}.brow .usd{font-weight:700;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.brow .ad{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:var(--mu)}.brow .ad a{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.brow .amt{color:var(--mu);font-size:13px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.brow .rl{grid-column:1/-1;color:var(--mu);font-size:13px;line-height:1.4}.brow .tk{grid-column:1/-1;font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.icb{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);background:none;cursor:pointer;color:var(--mu);flex:none}
.icb:hover{color:var(--tx);background:rgba(231,233,234,.08)}.icb svg{width:13px;height:13px}
.stale{color:var(--warn)}
.card.bal{padding-top:14px;padding-bottom:14px}.card.bal details.more{margin-left:0;margin-top:8px}
.btot{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:16px 20px;border-bottom:1px solid var(--bd2);font-weight:800;font-variant-numeric:tabular-nums}.btot small{grid-column:1/-1;color:var(--mu);font-weight:500;font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}.btn.busy svg{animation:spin .8s linear infinite}
/* declines */
.btn.dec{color:var(--mu);border-color:transparent}.btn.dec:hover{color:var(--red);background:rgba(244,33,46,.1);border-color:transparent}
.btn.dec svg{width:15px;height:15px}
.card.decl{padding-top:12px;padding-bottom:12px}.card.decl .tx{color:var(--mu);font-size:14px;margin:4px 0 0}
.rs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--mu)}
.rs button{border:1px solid var(--bd);background:none;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mu);cursor:pointer}
.rs button.on{border-color:#4a1d22;color:#ff6b7a}.rs .btn{margin-left:auto}
.decx{margin:12px 20px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--mu);font-size:13px}
#utoast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1d1f23;border:1px solid var(--bd);color:var(--tx);padding:8px 8px 8px 16px;border-radius:999px;font-size:14px;z-index:61;display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#utoast.on{opacity:1;pointer-events:auto}#utoast button{background:none;border:0;color:var(--ac);font-weight:700;cursor:pointer;padding:4px 10px;border-radius:999px}#utoast button:hover{background:rgba(29,155,240,.1)}
/* lightbox, toast */
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
@media(max-width:480px){nav button{padding:12px 10px 0;font-size:14px}nav i{margin-left:4px}.card{padding:14px 16px 16px}.acts,.steps,details.more{margin-left:0}.day{padding:20px 16px 8px}.hd{padding:12px 16px 4px}.btn{height:34px;padding:0 14px}}

function tweet(o){ // o: {handle,name,text,time,media,line,replyTo,metrics,count}
 const me=!o.handle||o.handle.toLowerCase()==ME;const name=me?'Darkpool':(o.name||o.handle);
 const n=o.count?xlen(o.text):0;
 return `<div class="tw ${o.line?'cont':''}"><div class="av">${av(o.handle,o.name)}${o.line?'<div class="ln"></div>':''}</div><div class="bd">
  <div class="who"><b>${esc(name)}</b>${me?VF:''}<span>@${esc(me?ME:o.handle)}${o.time?' · '+esc(o.time):''}</span></div>
  ${o.replyTo?`<div class="rt">Replying to <a href="https://x.com/${esc(o.replyTo)}" target="_blank" rel="noopener">@${esc(o.replyTo)}</a></div>`:''}
  <div class="tx">${rich(o.text)}</div>${o.count?`<div class="cnt ${n>280?'over':''}">${n} / 280</div>`:''}${media(o.media)}
  ${o.metrics&&Object.values(o.metrics).some(v=>v!=null)?`<div class="mx">${['replies','reposts','likes','views'].filter(k=>o.metrics[k]!=null).map(k=>`<span><b style="color:var(--tx);font-weight:600">${nf(+o.metrics[k])}</b> ${k}</span>`).join('')}</div>`:''}</div></div>`}

 dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 20h16"/></svg>',

function details(rows){rows=rows.filter(r=>r&&r[1]);if(!rows.length)return '';return `<details class="more"><summary>Details</summary><div class="in">${rows.map(([k,v])=>`<b>${esc(k)}</b>  ${esc(v)}`).join('\n\n')}</div></details>`}
// ---------- own post card ----------
function partsOf(d){const p=d.type=='thread'?String(d.text).split(/\n---\n/):[d.text];if(d.first_reply)p.push(d.first_reply);return p}
function postBody(d,key){const parts=partsOf(d),n=parts.length,self=d.first_reply&&d.type!='thread';
 let h=parts.map((t,j)=>tweet({text:t,time:j==0?'Draft':(self&&j==n-1?'Reply to yourself':`${j+1}/${n}`),media:j==0?d.media:null,line:j<n-1,count:true})).join('');
 if(n==1){const k=reg(clean(parts[0]));h+=`<div class="acts"><a class="btn pri" href="${intent(parts[0])}" target="_blank" rel="noopener" data-act="intent">${ICON.x}Post on X</a>${dlBtn(d.media)}<button class="btn sm" data-cp="${k}">Copy</button>${doneBtn(key)}</div>`}
 else{const links=ST('links.'+key)||{};h+='<div class="steps">';
  parts.forEach((t,j)=>{const k=reg(clean(t)),prev=j?idOf(links[j-1]):'',lab=j==0?'Post':(self&&j==n-1?'Reply to it':'Reply');
   h+=`<div class="step"><span class="n">${j+1}</span>${j?`<input data-link="${esc(key)}" data-j="${j-1}" placeholder="Paste the link to tweet ${j} once it's live" value="${esc(links[j-1]||'')}" class="${prev?'good':''}"><span></span>`:''}
    <span class="bt"><a class="btn ${j==0?'pri':''}" href="${intent(t,prev)}" target="_blank" rel="noopener" data-act="intent" data-step="${esc(key)}:${j}" aria-disabled="${j&&!prev?'true':'false'}">${ICON.x}${lab} ${j+1}/${n}</a>
    ${j==0?dlBtn(d.media):''}<button class="btn sm" data-cp="${k}">Copy</button></span></div>`});
  h+=`</div><div class="acts">${doneBtn(key)}</div>`}
 return h}
function postCard(d,alts){const key='d:'+d.id,stc=/^needs/.test(d.status||'')?'warn':'';
 const notes=String(d.notes||'');const g=notes.match(/GOAL:\s*([^·|]+)/),hk=notes.match(/HOOK:\s*(.+?)(?:\s·\s|\.\s\|\||$)/);
 let h=`<article class="card ${isDone(key)||d.status=='posted'?'done':''}" id="${esc(key)}"><div class="meta"><span class="time">${esc(clock(slotMin(d.slot)))}</span>
  ${d.post_type?`<span class="chip">${esc(d.post_type)}</span>`:''}${d.type=='thread'?'<span class="chip">thread</span>':''}${stc?`<span class="chip warn">${esc(d.status)}</span>`:''}
  ${d.status=='posted'&&d.posted_url?`<a href="${esc(d.posted_url)}" target="_blank" rel="noopener">View on X ↗</a>`:''}</div>`;
 h+=postBody(d,key);
 h+=details([['Goal',d.goal||(g&&g[1].trim())],['Hook',d.hook||(hk&&hk[1].trim())],['Slot',d.slot],['Why',d.rationale],['Notes',notes],['Angle / chain',[d.angle,d.chain].filter(Boolean).join(' · ')]]);
 if(alts&&alts.length)h+=`<details class="more"><summary>${alts.length} alternate version${alts.length>1?'s':''}</summary>${alts.map(a=>`<div class="alt">${postBody(a,'d:'+a.id)}</div>`).join('')}</details>`;

function decExport(){const d=decs(),L=Object.entries(d).sort((a,b)=>b[1].at-a[1].at);
 const pt=t=>new Date(t).toLocaleString('en-US',{timeZone:'America/Los_Angeles',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
 return `DARKPOOL desk · declined replies (${L.length}) · exported ${pt(Date.now())} PT\n`+L.map(([id,v])=>`- ${id} · @${v.author} · ${[v.type,v.angle].filter(Boolean).join('/')} · reason: ${(v.reasons||[]).join(', ')||'none given'} · declined ${pt(v.at)} PT\n  ${v.url||''}\n  "${String(v.reply||'').replace(/\s+/g,' ')}"`).join('\n')}
function undoToast(id){let t=$('utoast');if(!t){t=document.createElement('div');t.id='utoast';document.body.appendChild(t)}

  <div class="tx">${rich(v.reply||'')}</div>
  <div class="rs">Why? ${DECR.map(r=>`<button class="${rs.includes(r)?'on':''}" data-decr="${esc(id)}|${r}">${r}</button>`).join('')}<button class="btn sm" data-undec="${esc(id)}">Restore</button></div></article>`}

 return `<details class="done-grp" id="decgrp"><summary>Declined (${L.length}) · saved in this browser</summary>${L.map(decCard).join('')}

function replyCard(c){const key='r:'+c.id,k=reg(clean(c.reply)),posted=c.status=='posted';
 const pc=c.priority=='high'?'hi':'';

 h+=tweet({handle:c.author,name:c.author_name,text:c.target_text,time:ago(c.target_time),metrics:metr(c.target_metrics),line:true});
 h+=tweet({text:c.reply,time:posted?'Posted':'Draft',replyTo:c.author,count:true});
 h+=`<div class="acts">${posted&&c.posted_url?`<a class="btn" href="${esc(c.posted_url)}" target="_blank" rel="noopener">View reply ↗</a>`:`<a class="btn pri" href="${intent(c.reply,c.target_id)}" target="_blank" rel="noopener" data-act="intent">${ICON.x}Reply on X</a>`}<button class="btn sm" data-cp="${k}">Copy</button>${c.target_id?`<a class="btn sm" href="https://x.com/intent/like?tweet_id=${esc(c.target_id)}" target="_blank" rel="noopener" data-act="like" title="Opens X's like confirmation for this post">♡ Like</a>`:''}${posted?'':doneBtn(key)}${posted?'':`<button class="btn sm dec" data-dec="${esc(c.id)}" title="Hide this draft (undo anytime)">${ICDEC}Decline</button>`}</div>`;
 h+=details([['Goal',c.goal],['Hook',c.hook],['Topic',[c.topic,c.angle,c.chain].filter(Boolean).join(' · ')],['Author',c.author_followers?`@${c.author} · ${nf(+c.author_followers)} followers`:''],['Notes',c.notes]]);

// ---------- data views ----------
const ACTIVE=d=>!['expired','superseded','rejected','backlog'].includes(d.status);
function postsBy(){const all=(D.drafts||[]).filter(ACTIVE),ids=new Set(all.map(d=>d.id)),alts={};
 const mains=all.filter(d=>{const m=String(d.id).match(/^(.*)-[b-z]$/);if(m&&ids.has(m[1])){(alts[m[1]]=alts[m[1]]||[]).push(d);return false}return true});
 const by={};mains.forEach(d=>{(by[d.for_date]=by[d.for_date]||[]).push(d)});Object.values(by).forEach(L=>L.sort((a,b)=>slotMin(a.slot)-slotMin(b.slot)));return {by,alts}}
const doneKey=d=>'d:'+d.id;
function dayBlock(date,L,alts,showHead){const [a,b]=dayLabel(date);const open=L.filter(d=>!isDone(doneKey(d))&&d.status!='posted'),done=L.filter(d=>isDone(doneKey(d))||d.status=='posted');
 let h=showHead?`<div class="day">${a}<small>${b} · ${open.length} to post</small></div>`:'';

 if(done.length)h+=`<details class="done-grp"><summary>Done (${done.length})</summary>${done.map(d=>postCard(d,alts[d.id])).join('')}</details>`;return h}
const replies=()=>(D.comments||[]).filter(c=>['draft','approved'].includes(c.status)&&!isDec(c.id)).sort((a,b)=>(isDone('r:'+a.id)-isDone('r:'+b.id))||String(a.reply_by||'9').localeCompare(String(b.reply_by||'9')));

function vToday(){const {by,alts}=postsBy(),L=by[D.today]||[],R=replies().filter(c=>!isDone('r:'+c.id)),T=tgs().filter(m=>m.for_date==D.today&&!isDone('t:'+m.id));

 if(R.length){const late=R.filter(c=>c.reply_by&&new Date(c.reply_by)<Date.now()).length,nx=R.find(c=>c.reply_by&&new Date(c.reply_by)>=Date.now());

 h+=L.length?dayBlock(D.today,L,alts,false):'<div class="empty">Nothing left to post today.</div>';
 const posted=(D.archive||[]).filter(a=>a.type!='repost');if(posted.length)h+=`<details class="done-grp"><summary>Posted on X today (${posted.length})</summary>${posted.map(a=>`<article class="card done">${tweet({text:a.text,time:ptClock(a.date),replyTo:a.in_reply_to&&a.in_reply_to.handle})}<div class="acts"><a class="btn sm" href="${esc(a.url)}" target="_blank" rel="noopener">View on X ↗</a></div></article>`).join('')}</details>`;
 return h}

// ---------- balances (internal; live on tab open, build snapshot as fallback) ----------
const SOLRPC=['https://solana-rpc.publicnode.com','https://api.mainnet-beta.solana.com'],RHRPC='https://rpc.mainnet.chain.robinhood.com',WSOL='So11111111111111111111111111111111111111112';
const BAL={live:null,busy:false,err:[],tried:0};
function fetchT(u,o={},ms=12000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(u,{...o,signal:c.signal}).then(r=>{if(r.status==429)throw Error('rate-limited');if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).finally(()=>clearTimeout(t))}
let JUPT=0;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function jup(u){const w=Math.max(0,JUPT+2100-Date.now());JUPT=Date.now()+w;if(w)await sleep(w);return fetchT(u)} // Jupiter's free API allows ~5 calls per 10 s per IP, so calls are spaced
const post=b=>({method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
async function solRpc(method,params){let e;for(const u of SOLRPC){try{const j=await fetchT(u,post({jsonrpc:'2.0',id:1,method,params}));if(j.error)throw Error(j.error.message);return j.result}catch(x){e=x}}throw e}
async function loadBal(){if(BAL.busy)return;BAL.busy=true;BAL.tried=Date.now();if(TAB=='balances')rerenderBal();
 const W=D.wallets||[],snap=D.balsnap||{},bal=JSON.parse(JSON.stringify(snap.bal||{})),prices=JSON.parse(JSON.stringify(snap.prices||{})),src={},err=[];
 const sol=W.filter(w=>w.chain=='sol'),rh=W.filter(w=>w.chain=='rh');
 const core=[
  solRpc('getMultipleAccounts',[sol.map(w=>w.address),{encoding:'base64',dataSlice:{offset:0,length:0}}]).then(r=>r.value.forEach((a,i)=>{const k=sol[i].address;(bal[k]=bal[k]||{}).native=(a?a.lamports:0)/1e9;src[k]=1})).catch(e=>err.push('Solana RPC: '+e.message)),
  Promise.all(rh.map(w=>fetchT(RHRPC,post({jsonrpc:'2.0',id:1,method:'eth_getBalance',params:[w.address,'latest']})).then(j=>{if(j.error)throw Error(j.error.message);(bal[w.address]=bal[w.address]||{}).native=Number(BigInt(j.result))/1e18;src[w.address]=1}))).catch(e=>err.push('Robinhood RPC: '+e.message)),
 ];
 const tokJob=(async()=>{ // token holdings change rarely and Jupiter's free API rate-limits, so they are cached for 5 minutes
   const fresh=BAL.tok&&Date.now()-BAL.tok.at<300000,failed=[];
   for(const [i,w] of sol.filter(w=>w.tokens).entries()){const b=bal[w.address]=bal[w.address]||{};
    if(fresh&&BAL.tok.data[w.address]){b.tokens=BAL.tok.data[w.address];continue}
    let h=null;for(let a=0;a<2&&!h;a++){try{h=await jup('https://lite-api.jup.ag/ultra/v1/holdings/'+w.address)}catch(e){if(a==0&&/rate/.test(e.message))await sleep(4000);else break}}
    if(!h){failed.push(w.label);continue}
    const t={};for(const [m,accs] of Object.entries(h.tokens||{}))t[m]=accs.reduce((n,a)=>n+(+a.uiAmount||0),0);b.tokens=t;
    BAL.tok=BAL.tok&&!fresh?BAL.tok:(BAL.tok||{at:Date.now(),data:{}});if(!fresh)BAL.tok.at=Date.now();BAL.tok.data[w.address]=t;
    if(!src[w.address]&&h.uiAmount!=null){b.native=+h.uiAmount;src[w.address]=1}}
   if(failed.length)err.push(`Token balances for ${failed.length} wallet${failed.length>1?'s':''} unavailable (Jupiter busy); using the ${BAL.tok?'last fetched':'build snapshot'} values`)})();
 core.push(fetchT('https://api.coingecko.com/api/v3/simple/price?ids=solana,ethereum&vs_currencies=usd').then(c=>{prices.ETH=c.ethereum.usd;prices.cgSOL=c.solana.usd;src.ETH=1}).catch(e=>err.push('ETH price: '+e.message)));
 await Promise.all(core);
 if(prices.cgSOL&&!(BAL.px&&Date.now()-BAL.px.at<60000))prices.SOL=prices.cgSOL; // provisional until Jupiter's price lands
 if(Object.keys(src).length){BAL.live={at:new Date().toISOString(),bal,prices,src,partial:true};if(TAB=='balances')rerenderBal()}
 await tokJob;
 const mints=new Set([WSOL]);Object.values(bal).forEach(b=>Object.keys(b.tokens||{}).forEach(m=>mints.add(m)));
 if(BAL.px&&Date.now()-BAL.px.at<60000&&[...mints].every(m=>m in BAL.px.mints)){prices.mints={...(prices.mints||{}),...BAL.px.mints};prices.SOL=BAL.px.mints[WSOL];src.SOL=1} // Jupiter prices reused for 60 s
 else for(let a=0;a<2;a++){try{const p=await jup('https://lite-api.jup.ag/price/v3?ids='+[...mints].join(','));prices.mints={...(prices.mints||{})};for(const [m,x] of Object.entries(p))if(x&&x.usdPrice)prices.mints[m]=x.usdPrice;
   if(p[WSOL]&&p[WSOL].usdPrice){prices.SOL=p[WSOL].usdPrice;src.SOL=1}BAL.px={at:Date.now(),mints:{...prices.mints}};break}
  catch(e){if(a==0&&/rate/.test(e.message)){await sleep(4000);continue}if(!prices.cgSOL||mints.size>1)err.push('Token prices: '+e.message+'; SOL priced from CoinGecko, tokens from the build snapshot');break}}
 if(!src.SOL&&prices.cgSOL){prices.SOL=prices.cgSOL;src.SOL=1}
 BAL.live=Object.keys(src).length?{at:new Date().toISOString(),bal,prices,src}:null;BAL.err=err;BAL.busy=false;if(TAB=='balances')rerenderBal()}
function rerenderBal(){const y=scrollY;render();scrollTo(0,y)}
const usd=n=>n==null||isNaN(n)?'–':'$'+(Math.abs(n)>=1000?Math.round(n).toLocaleString('en-US'):n.toFixed(2));
const amt=(n,d=4)=>n==null?'–':(+n).toLocaleString('en-US',{minimumFractionDigits:Math.min(d,2),maximumFractionDigits:d});
const shortA=a=>a.slice(0,a.startsWith('0x')?6:4)+'…'+a.slice(-4);
const exUrl=w=>w.chain=='rh'?'https://robinhoodchain.blockscout.com/address/'+w.address:'https://solscan.io/account/'+w.address;
const ICP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',IRF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>';
function valued(w,S){const b=S.bal[w.address]||{},P=S.prices||{},px=w.chain=='rh'?P.ETH:P.SOL,nat=b.native,tk=[];let tusd=0;
 for(const [m,a] of Object.entries(b.tokens||{})){const pr=m==WSOL?P.SOL:(P.mints||{})[m],v=pr!=null?a*pr:null;if(v!=null&&v>=1){tk.push({m,a,v});tusd+=v}}
 return {nat,usd:nat!=null&&px!=null?nat*px+tusd:null,natUsd:nat!=null&&px!=null?nat*px:null,tk,tusd}}
function vBalances(){const W=D.wallets||[];if(!W.length)return '<div class="empty">No wallets configured.</div>';
 if(!BAL.live&&!BAL.busy&&Date.now()-BAL.tried>60000)setTimeout(loadBal,0);
 const S=BAL.live||{...(D.balsnap||{}),src:{}},live=!!BAL.live,P=S.prices||{},sym=D.symbols||{};
 const team=W.filter(w=>w.group!='locked'),locked=W.filter(w=>w.group=='locked');
 const V=Object.fromEntries(W.map(w=>[w.address,valued(w,S)]));
 const sum=(L,f)=>L.reduce((n,w)=>n+(f(V[w.address],w)||0),0);
 const tot=sum(team,v=>v.usd),tSol=sum(team.filter(w=>w.chain=='sol'),v=>v.nat),tEth=sum(team.filter(w=>w.chain=='rh'),v=>v.nat),tTok=sum(team,v=>v.tusd);
 const when=S.at?ptClock(S.at)+' PT':'';
 const row=w=>{const v=V[w.address],k=reg(w.address),ok=!live||S.src[w.address];
  return `<article class="card bal" data-wallet="${esc(w.id)}"><div class="brow"><div class="nm">${esc(w.label)}</div><div class="usd${ok?'':' stale'}" data-usd>${usd(v.usd)}</div>
  <div class="ad"><a href="${exUrl(w)}" target="_blank" rel="noopener" title="${esc(w.address)}">${shortA(w.address)} ↗</a><button class="icb" data-cp="${k}" aria-label="Copy address" title="Copy address">${ICP}</button></div>
  <div class="amt${ok?'':' stale'}" data-amt>${amt(v.nat)} ${w.chain=='rh'?'ETH':'SOL'}</div>
  <div class="rl">${esc(w.role)}</div>${v.tk.length?`<div class="tk">+ ${v.tk.map(t=>`${amt(t.a,t.a>=1000?0:4)} ${esc(sym[t.m]||shortA(t.m))} (${usd(t.v)})`).join(' · ')}</div>`:''}</div>
  ${details([['Source',w.source],['Address',w.address],ok?null:['Note','Live fetch failed for this wallet; showing the build snapshot.']])}</article>`};
 const sec=(t,L,unit)=>`<div class="bsec">${t}<span>${usd(sum(L,v=>v.usd))}</span></div>`+L.map(row).join('');
 return `<div class="day">Balances<small>Team wallets · internal only, never for posts</small></div>
 <div class="bsum" id="bsum"><div class="lbl">Team total (spendable)</div><div class="big" data-total>${usd(tot)}</div>
  <div class="sub"><b>${amt(tSol)} SOL</b> · <b>${amt(tEth)} ETH</b>${tTok>=1?` · <b>${usd(tTok)}</b> in tokens`:''}</div>
  <div class="sub" style="margin-top:6px;font-size:13px">SOL ${usd(P.SOL)} · ETH ${usd(P.ETH)}</div>
  <div class="bstat">${BAL.busy&&!live?'<span class="chip">Loading live balances…</span>':live?`<span class="chip ok live" data-state="live">Live</span><span>updated ${esc(when)}${BAL.busy?' · loading tokens…':''}</span>`:`<span class="chip warn" data-state="snap">Snapshot</span><span>from build ${esc(when)}</span>`}
  <button class="btn sm${BAL.busy?' busy':''}" data-balref>${IRF}Refresh</button></div>
  ${BAL.err.length&&!BAL.busy?`<div class="berr" data-err>${live?BAL.err.map(esc).join('<br>'):'Couldn\'t reach the live sources, so this is the build snapshot. Tap Refresh to retry.'}</div>`:''}</div>
 ${sec('Solana',team.filter(w=>w.chain=='sol'))}${sec('Robinhood Chain',team.filter(w=>w.chain=='rh'))}
 <div class="btot">Total<span>${usd(tot)}</span><small>${amt(tSol)} SOL + ${amt(tEth)} ETH${tTok>=1?' + '+usd(tTok)+' tokens':''} · tokens under $1 (dust, airdrops) hidden</small></div>
 <details class="done-grp"><summary>Locked rent, not in the total (${amt(sum(locked,v=>v.nat))} SOL)</summary>${locked.map(row).join('')}</details>
 <div class="note" style="cursor:default;display:block">Not team funds, so not listed: the pool reserves on both chains (users' shielded coins) and the private holders' $DARKPOOL vault. The keeper's private working balance is shielded (about 0.1 SOL by config), so no address can show it.</div>`}
const TABS=[['today','Today',()=>((postsBy().by[D.today]||[]).filter(d=>!isDone(doneKey(d))&&d.status!='posted').length)],['upcoming','Upcoming',()=>Object.entries(postsBy().by).filter(([d])=>d>D.today).reduce((n,[,L])=>n+L.length,0)],
 ['replies','Replies',()=>replies().filter(c=>!isDone('r:'+c.id)).length],['telegram','Telegram',()=>tgs().filter(m=>!isDone('t:'+m.id)).length],['dms','DMs',()=>dms().filter(o=>!isDone('o:'+(o.id||o.handle||o.name))).length],['balances','Balances',()=>'']];
function render(){CN=0;for(const k in COPY)delete COPY[k];if(!TABS.find(t=>t[0]==TAB))TAB='today';
 $('nav').innerHTML=TABS.filter(t=>(t[0]!='dms'||dms().length)&&(t[0]!='balances'||(D.wallets||[]).length)).map(([id,l,c])=>`<button class="${TAB==id?'on':''}" data-tab="${id}"><span>${l}<i>${c()||''}</i></span></button>`).join('');
 $('main').innerHTML={today:vToday,upcoming:vUpcoming,replies:vReplies,telegram:vTelegram,dms:vDMs,balances:vBalances}[TAB]()}
// ---------- events ----------
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-go],[data-cp],[data-done],[data-balref],[data-dec],[data-undec],[data-decr],img[data-full],#lb');if(!t)return;
 if(t.dataset.dec||t.dataset.undec||t.dataset.decr){const g=$('decgrp'),open=g&&g.open,y=scrollY;
  if(t.dataset.dec){decline(t.dataset.dec);undoToast(t.dataset.dec)}
  else if(t.dataset.undec){setDec(t.dataset.undec,null);const u=$('utoast');if(u)u.classList.remove('on');toast('Restored')}
  else{const [id,r]=t.dataset.decr.split('|'),d=decs();if(d[id]){const rs=d[id].reasons||[];d[id].reasons=rs.includes(r)?rs.filter(x=>x!=r):[...rs,r];ST('declined',d)}}
  render();const g2=$('decgrp');if(g2&&(open||t.dataset.decr))g2.open=true;scrollTo(0,y);return}
 if(t.hasAttribute('data-balref')){loadBal();return}
 if(t.id=='lb'){t.hidden=true;return}
 if(t.dataset.tab||t.dataset.go){TAB=t.dataset.tab||t.dataset.go;try{sessionStorage.dpTab=TAB}catch(_){};render();scrollTo(0,0);return}
 if(t.dataset.cp){cp(t.dataset.cp);if(t.hasAttribute('data-decexp'))setTimeout(()=>toast('Declined list copied'),50);return}
 if(t.dataset.done){const k=t.dataset.done;setDone(k,!isDone(k));const y=scrollY;render();scrollTo(0,y);toast(isDone(k)?'Marked posted':'Moved back');return}
 if(t.dataset.full){const lb=$('lb');lb.querySelector('img').src=t.dataset.full;lb.hidden=false}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('lb').hidden=true});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset.link)return;const key=t.dataset.link,j=+t.dataset.j,L=ST('links.'+key)||{};L[j]=t.value.trim();ST('links.'+key,L);
 const id=idOf(t.value);t.classList.toggle('good',!!id);const b=document.querySelector(`[data-step="${CSS.escape(key)}:${j+1}"]`);
 if(b){const step=b.closest('.step'),k=step.querySelector('[data-cp]').dataset.cp;b.href=intent(COPY[k],id);b.setAttribute('aria-disabled',id?'false':'true')}});
</script></body></html>
