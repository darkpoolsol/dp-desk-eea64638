D=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},key,u(P.c))));localStorage.dp=p;lock.hidden=true;app.hidden=false;render()}catch(e){localStorage.removeItem('dp');err.textContent='Wrong password'}}
document.getElementById('pw').onkeydown=e=>e.key=='Enter'&&go();if(localStorage.dp)go(localStorage.dp);
function tab(n){T=n;b1.className=n==1?'on':'';b2.className=n==2?'on':'';f.hidden=n!=1;render()}
function cp(i,btn){navigator.clipboard.writeText(document.getElementById('x'+i).innerText.replace(/^\[EXAMPLE\] /,'')).then(()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1200)})}
const dt=s=>new Date(s).toLocaleString('en-US',{timeZone:'America/Vancouver',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' PT';
function render(){let h='';if(T==1){const fv=f.value;D.drafts.filter(d=>!fv||d.status==fv).forEach((d,i)=>{
const parts=d.type=='thread'?d.text.split(/\n---\n/):[d.text];h+=`<div class="c"><span class="pill ${d.status}">${d.status}</span><span class="pill">${d.type}</span><span class="m">${esc(d.id)} · ${esc(d.created)}</span>`;
if(d.target)h+=`<div class="m">Reply to: <a href="${d.target}" target="_blank">${d.target}</a></div>`;
parts.forEach((t,j)=>{h+=`<div class="t" id="x${i}_${j}">${esc(t)}</div><button onclick="cp('${i}_${j}',this)">Copy</button> <span class="m">${t.replace(/^\[EXAMPLE\] /,'').length} chars</span>`});
h+=`<p class="m"><b>Why:</b> ${esc(d.rationale)}</p>${d.notes?`<p class="m"><b>Notes:</b> ${esc(d.notes)}</p>`:''}</div>`});if(!h)h='<p class="m">No drafts.</p>'}
else{D.archive.forEach(r=>{const ref=r.in_reply_to||r.quoted||r.reposted;h+=`<div class="c"><span class="pill">${r.type}${r.self_thread?' (thread)':''}</span><a class="m" href="${r.url}" target="_blank">${dt(r.date)}</a>
${ref&&ref.text&&r.type!='repost'?`<div class="p">${r.type=='quote'?'Quoting':'Replying to'} @${esc(ref.handle)}: ${esc(ref.text)}</div>`:''}<div class="t">${esc(r.text)}</div>
<span class="m">♥ ${r.metrics.like_count||0} · ↻ ${r.metrics.retweet_count||0} · 💬 ${r.metrics.reply_count||0} · 👁 ${r.metrics.impression_count||0}</span></div>`})}
main.innerHTML=h+`<p class="m" style="text-align:center">Built ${D.built}</p>`}
</script></body></html>
